# NodFirst documentation site (GitHub Pages + Just the Docs).
# Pages are generated by maintainers/tools/build_site.py into .site-build/; do not add content pages here.
title: NodFirst
description: Spec-Driven Development kit for any AI coding agent. Nothing gets built until you say yes.
url: "https://kaylit.github.io"
baseurl: "/nodfirst"
lang: en

remote_theme: just-the-docs/just-the-docs@v0.12.0
plugins:
  - jekyll-remote-theme
  - jekyll-include-cache
  - jekyll-seo-tag

color_scheme: nodfirst
logo: "/assets/images/nodfirst-logo-light.svg"

search_enabled: true
search:
  heading_level: 3
  previews: 2
  button: true

heading_anchors: true
back_to_top: true
back_to_top_text: "Back to top"

aux_links:
  "NodFirst on GitHub": "https://github.com/kaylit/nodfirst"
aux_links_new_tab: false

footer_content: 'NodFirst is released under the <a href="https://github.com/kaylit/nodfirst/blob/main/LICENSE">MIT licence</a>. These pages are generated from the files in the repository.'

callouts:
  note:
    title: Note
    color: blue
  warning:
    title: Not yet proven
    color: yellow

kramdown:
  input: GFM
  syntax_highlighter_opts:
    disable: true
